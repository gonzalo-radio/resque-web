# Resque::Web config (Perl hash, loaded by the Mojolicious Config plugin).
# The whole hash is passed to Resque->new. This file is evaluated as Perl, so it
# reads env vars at runtime with sensible fallbacks: a published image can be
# pointed at any redis via -e RESQUE_REDIS=host:port without rebuilding, while
# the defaults keep compose.yml working (service name `redis`).
# See setup_plugins in lib/Resque/Web.pm.
{
    redis     => $ENV{RESQUE_REDIS}     || 'redis:6379',
    namespace => $ENV{RESQUE_NAMESPACE} || 'resque',
}
